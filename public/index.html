<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>FORGE</title>
    <meta name="description" content="FORGE — Train. Build. Become. Your gym journey app." />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="application-name" content="FORGE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FORGE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Keep splash feel while JS loads */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background-color: #0d0d0d;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(
            function (registration) {
              console.log('Service Worker registered:', registration.scope);
            },
            function (error) {
              console.warn('Service Worker registration skipped/failed:', error);
            }
          );
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run FORGE.</noscript>
    <div id="root"></div>
  </body>
</html>
